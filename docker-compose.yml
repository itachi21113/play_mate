services:
  db:
    image: postgres:16-alpine
    container_name: playmate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: playmate
      POSTGRES_PASSWORD: playmate_pass
      POSTGRES_DB: playmate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playmate -d playmate_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: playmate_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
